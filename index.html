<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="src/css/style.css">
  <link rel="shortcut icon" href="src/images/firefox_logo.png" type="image/x-icon">
  <title>Нова вкладка</title>
</head>
<body class="flex">
<!--===: top section :===-->
<section id="section_top_info" class="flex">
  <div id="time_welcome" class="text-center">
    <h3 id="current_time">11:11</h3>
    <h5>Welcome, <strong class="username">Bogdan</strong></h5>
  </div>
  <div id="date_weather" class="text-center">
    <h3 id="current_date">Feb 28</h3>
    <h5 id="current_weather">23°C | took 47ms</h5>
  </div>
</section>

<!--===: middle section :===-->
<section id="section_middle_search" class="flex">
  <form action="https://www.google.com/search" method="get" class="terminal-form">
    <label for="search"><svg xmlns="http://www.w3.org/2000/svg" width="1.2em" height="1.2em" viewBox="0 0 8 8"><path fill="currentColor" d="M4 5C2 7-1.5 4 1 1c3-2.5 6 1 4 3l3 3l-1 1M1.5 1.5C0 3 2 6 4 4S3 0 1.5 1.5"/></svg> </label>
    <input type="text" name="q" id="search" placeholder="" autocomplete="off" autofocus>
  </form>
</section>

<!--===: bottom section | links 6 categories :===-->
<section class="section_bottom_links" id="section_bottom_links"> </section>

<section class="section_right_bar"> </section>

<script src="src/js/index.js"></script>
</body>
</html>
